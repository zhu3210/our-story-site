<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>我们的故事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="heart" aria-hidden="true">&#9829;</span>
      <div>
        <h1 id="site-title">我们的故事</h1>
        <div class="sub" id="site-sub"></div>
      </div>
    </div>
    <nav class="tabs" aria-label="页面">
      <a href="#/map" data-view="map">地图</a>
      <a href="#/album" data-view="album">相册</a>
      <a href="#/videos" data-view="videos">视频</a>
    </nav>
    <button class="upload-btn" id="upload-btn" type="button" hidden>＋ 上传</button>
    <a class="logout" href="/logout" title="退出登录">退出</a>
  </header>

  <main>
    <section id="view-map" class="view">
      <div id="space" aria-hidden="true"><canvas class="stars"></canvas><canvas class="twinkle"></canvas></div>
      <div id="map"></div>
      <div class="paper-grain" aria-hidden="true"></div>
      <button class="globe-btn" id="globe-btn" type="button" title="回到全球">全球</button>
      <div class="theme-switch" role="group" aria-label="地图风格">
        <button type="button" data-theme="watercolor">水彩</button>
        <button type="button" data-theme="vintage">复古</button>
      </div>
      <aside class="panel" id="panel"></aside>
      <div class="tl-strip" id="tl-strip" hidden></div>
    </section>

    <section id="view-album" class="view">
      <div class="album-bar" id="album-bar"></div>
      <div class="album" id="album"></div>
    </section>

    <section id="view-videos" class="view">
      <div class="videos" id="videos"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" type="button" aria-label="关闭">&times;</button>
    <button class="lb-prev" type="button" aria-label="上一张">&#8249;</button>
    <figure>
      <img alt="">
      <figcaption>
        <div class="lb-caption"></div>
        <div class="lb-meta"></div>
        <button class="lb-map" type="button">在地图上看</button>
      </figcaption>
    </figure>
    <button class="lb-next" type="button" aria-label="下一张">&#8250;</button>
  </div>

  <div class="player" id="player" hidden>
    <button class="lb-close" type="button" aria-label="关闭">&times;</button>
    <div class="player-inner">
      <video controls playsinline></video>
      <div class="player-title"></div>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" type="button" aria-label="关闭">&times;</button>
      <h2 class="modal-title"></h2>
      <div class="modal-body"></div>
      <div class="modal-foot"></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>
  <div class="ctx-menu" id="ctx-menu" role="menu" hidden></div>
  <div class="sel-bar" id="sel-bar" hidden></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/hls.min.js"></script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
